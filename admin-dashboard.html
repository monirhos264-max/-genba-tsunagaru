
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理者ダッシュボード | 現場つながる</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Arial,sans-serif}
header{background:#1e3a8a;color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h2{margin:0;font-size:19px}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px;font-weight:bold}
.logout{background:white;color:#1e3a8a}
main{max-width:1100px;margin:auto;padding:18px}
h3{margin-top:0}
.welcome{margin-bottom:20px}
.welcome p{color:#64748b}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.summary-card{background:white;padding:17px;border-radius:12px;box-shadow:0 2px 8px #00000008}
.number{font-size:27px;font-weight:bold;color:#1d4ed8;margin-top:8px}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}
.controls{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;min-width:0}
input{flex:1;min-width:170px}
.refresh{background:#1d4ed8;color:white}
.status{padding:12px;border-radius:8px;background:#eff6ff;color:#1e40af;margin-bottom:15px}
.error{background:#fef2f2;color:#b91c1c}
.record{border:1px solid #e2e8f0;border-radius:9px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.record-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.name{font-weight:bold;font-size:16px}
.date{font-size:13px;color:#64748b}
.category{display:inline-block;background:#e0e7ff;color:#3730a3;padding:5px 9px;border-radius:6px;font-size:13px;margin:5px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;padding:12px;border-radius:7px;font-size:13px;line-height:1.5}
.empty{text-align:center;color:#64748b;padding:25px}
@media(max-width:600px){main{padding:12px}.panel{padding:13px}header h2{font-size:16px}}
</style>
</head>
<body>

<header>
  <h2>現場つながる | 管理者画面</h2>
  <button class="logout" id="logoutButton">ログアウト</button>
</header>

<main>
  <div class="welcome">
    <h2>管理者ダッシュボード</h2>
    <p>全現場のデータを確認できます。</p>
  </div>

  <div id="status" class="status">ログインを確認しています...</div>

  <div class="summary">
    <div class="summary-card">出勤・退勤<div class="number" id="attendanceCount">0</div></div>
    <div class="summary-card">作業報告<div class="number" id="reportCount">0</div></div>
    <div class="summary-card">備品申請<div class="number" id="equipmentCount">0</div></div>
    <div class="summary-card">納品確認<div class="number" id="deliveryCount">0</div></div>
    <div class="summary-card">位置情報<div class="number" id="locationCount">0</div></div>
  </div>

  <section class="panel">
    <h3>データ検索</h3>
    <div class="controls">
      <input id="searchInput" type="search" placeholder="従業員名で検索">
      <select id="typeFilter">
        <option value="all">すべて表示</option>
        <option value="attendance_records">出勤・退勤</option>
        <option value="work_reports">作業報告</option>
        <option value="equipment_requests">備品申請</option>
        <option value="delivery_records">納品確認</option>
        <option value="location_records">位置情報</option>
      </select>
      <button class="refresh" id="refreshButton">データ更新</button>
    </div>
  </section>

  <section class="panel">
    <h3>作業データ一覧</h3>
    <div id="records"><p class="empty">読み込み中...</p></div>
  </section>
</main>

<script src="app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const config = window.GENBA_CONFIG;

if (!config || !config.publishableKey || !config.functionUrl) {
  document.getElementById("status").textContent = "アプリ設定を読み込めません。";
  document.getElementById("status").classList.add("error");
  throw new Error("Missing app configuration");
}

const supabase = window.supabase.createClient(
  "https://woyappmxwoutbsyljpil.supabase.co",
  config.publishableKey
);

const adminApiUrl = config.functionUrl.replace(
  "/genba-api",
  "/genba-admin-api"
);

const tableNames = {
  attendance_records: "出勤・退勤",
  work_reports: "作業報告",
  equipment_requests: "備品申請",
  delivery_records: "納品確認",
  location_records: "位置情報"
};

const countIds = {
  attendance_records: "attendanceCount",
  work_reports: "reportCount",
  equipment_requests: "equipmentCount",
  delivery_records: "deliveryCount",
  location_records: "locationCount"
};

let allRecords = [];

function showStatus(message, error = false) {
  const box = document.getElementById("status");
  box.textContent = message;
  box.className = error ? "status error" : "status";
}

async function getSession() {
  const { data, error } = await supabase.auth.getSession();

  if (error || !data.session) {
    window.location.replace("admin-login.html");
    return null;
  }

  return data.session;
}

async function loadRecords() {
  showStatus("データを読み込んでいます...");
  document.getElementById("records").textContent = "読み込み中...";

  const session = await getSession();
  if (!session) return;

  try {
    const response = await fetch(adminApiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": config.publishableKey,
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        action: "list",
        tables: Object.keys(tableNames)
      })
    });

    const result = await response.json();

    if (response.status === 401) {
      await supabase.auth.signOut();
      window.location.replace("admin-login.html");
      return;
    }

    if (!response.ok || !result.success) {
      throw new Error(result.error || "データ取得に失敗しました");
    }

    allRecords = [];

    Object.keys(tableNames).forEach(table => {
      const rows = result.data[table] || [];

      document.getElementById(countIds[table]).textContent = rows.length;

      rows.forEach(row => {
        allRecords.push({...row, table});
      });
    });

    allRecords.sort((a,b) =>
      new Date(b.created_at) - new Date(a.created_at)
    );

    showStatus("データを正常に読み込みました。");
    renderRecords();

  } catch (error) {
    showStatus("エラー: " + error.message, true);
    document.getElementById("records").textContent =
      "データを取得できませんでした。設定を確認してください。";
  }
}

function renderRecords() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const filter = document.getElementById("typeFilter").value;

  const filtered = allRecords.filter(record => {
    const name = (record.employee_name || "").toLowerCase();
    return name.includes(search) &&
      (filter === "all" || record.table === filter);
  });

  const container = document.getElementById("records");
  container.replaceChildren();

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "該当するデータはありません。";
    container.appendChild(empty);
    return;
  }

  filtered.forEach(record => {
    const card = document.createElement("div");
    card.className = "record";

    const head = document.createElement("div");
    head.className = "record-head";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = record.employee_name || "名前なし";

    const date = document.createElement("div");
    date.className = "date";
    const parsed = new Date(record.created_at);
    date.textContent = Number.isNaN(parsed.getTime())
      ? ""
      : parsed.toLocaleString("ja-JP");

    head.append(name, date);

    const category = document.createElement("div");
    category.className = "category";
    category.textContent = tableNames[record.table];

    const details = document.createElement("pre");
    details.textContent = JSON.stringify(record.record_data || {}, null, 2);

    card.append(head, category, details);
    container.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input", renderRecords);
document.getElementById("typeFilter").addEventListener("change", renderRecords);
document.getElementById("refreshButton").addEventListener("click", loadRecords);

document.getElementById("logoutButton").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.replace("admin-login.html");
});

loadRecords();
</script>

</body>
</html>
