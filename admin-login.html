
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン | 現場つながる</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }
    h2 { text-align: center; color: #1e293b; }
    .subtitle { text-align: center; color: #64748b; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>現場つながる</h2>
    <p class="subtitle">管理者ログイン</p>

    <form id="loginForm">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">パスワード</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button id="loginButton" type="submit">ログイン</button>
      <div id="message"></div>
    </form>
  </div>

  <script src="app-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const config = window.GENBA_CONFIG;

    if (!config || !config.publishableKey) {
      document.getElementById("message").textContent =
        "設定を読み込めません。管理者に連絡してください。";
    } else {
      const supabase = window.supabase.createClient(
        "https://woyappmxwoutbsyljpil.supabase.co",
        config.publishableKey
      );

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "ログイン中...";
        message.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          message.textContent = "ログインできません。メールアドレスとパスワードを確認してください。";
          button.disabled = false;
          button.textContent = "ログイン";
          return;
        }

        window.location.href = "admin-dashboard.html";
      });
    }
  </script>

</body>
</html>
