

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備品申請 | 現場つながる</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #f1f5f9;
  color: #1e293b;
  font-family: Arial, sans-serif;
}

header {
  background: #17365d;
  color: white;
  text-align: center;
  padding: 22px;
  border-radius: 14px;
}

.container {
  max-width: 600px;
  margin: 20px auto;
}

.card {
  background: white;
  padding: 22px;
  margin-bottom: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: bold;
  margin: 16px 0 7px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 9px;
  background: #15803d;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #94a3b8;
}

.application {
  border-bottom: 1px solid #e2e8f0;
  padding: 15px 0;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.application:last-child {
  border-bottom: none;
}

.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 6px;
  background: #fef3c7;
  color: #92400e;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin: 22px 0;
  color: #17365d;
  text-decoration: none;
  font-weight: bold;
}

#message {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<header>
  <h2>現場つながる</h2>
  <p>備品申請システム</p>
</header>

<main class="container">

  <div class="card">
    <h3>🛠️ 備品・消耗品の申請</h3>

    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin:14px 0;">
      <strong>🔔 申請完了通知を受け取る</strong>
      <p style="font-size:14px;line-height:1.6;margin:8px 0;color:#334155;">
        社員名を入力してから下のボタンを押してください。管理者が備品申請を「完了」にすると、この端末に通知が届きます。
      </p>
      <button type="button" id="enablePushBtn" style="margin-top:4px;background:#1769aa;">
        この端末で通知を受け取る
      </button>
      <p id="pushMessage" role="status" style="font-size:13px;line-height:1.5;margin:9px 0 0;"></p>
    </div>

    <form id="equipmentForm">

      <label for="employeeName">社員名</label>
      <input type="text" id="employeeName"
        placeholder="社員名を入力してください" required>

      <label for="siteName">現場名</label>
      <input type="text" id="siteName"
        placeholder="例：ファミールハイツ城東" required>

      <label for="equipmentName">備品名</label>
      <input type="text" id="equipmentName"
        placeholder="例：掃除機、モップ、手袋" required>

      <label for="quantity">数量</label>
      <input type="number" id="quantity"
        min="1" step="1" placeholder="必要な数量" required>

      <label for="requestDate">希望日</label>
      <input type="date" id="requestDate" required>

      <label for="reason">申請理由</label>
      <textarea id="reason"
        placeholder="申請理由を入力してください" required></textarea>

      <button type="submit" id="submitBtn">
        申請を保存する
      </button>

      <p id="message" role="status"></p>

    </form>
  </div>

  <div class="card">
    <h3>📋 申請履歴</h3>
    <div id="applicationHistory">申請はまだありません</div>
  </div>

  <a class="back" href="dashboard.html">
    ← ダッシュボードへ戻る
  </a>

</main>

<script src="app-config.js"></script>

<script>
const STORAGE_KEY = "genba_equipment_requests";

let applications = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

const form = document.getElementById("equipmentForm");
const submitBtn = document.getElementById("submitBtn");
const enablePushBtn = document.getElementById("enablePushBtn");
const pushMessage = document.getElementById("pushMessage");

function showPushMessage(message, color = "#1769aa") {
  pushMessage.textContent = message;
  pushMessage.style.color = color;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(char => char.charCodeAt(0)));
}

async function enablePushNotifications() {
  const employeeName = document.getElementById("employeeName").value.trim();
  if (!employeeName) {
    showPushMessage("先に社員名を入力してください。", "#dc2626");
    document.getElementById("employeeName").focus();
    return;
  }

  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    showPushMessage("このブラウザはPush通知に対応していません。iPhoneではホーム画面に追加したアプリから開いてください。", "#dc2626");
    return;
  }

  const publicKey = window.GENBA_CONFIG && window.GENBA_CONFIG.pushPublicKey;
  if (!publicKey) {
    showPushMessage("通知設定が見つかりません。管理者に連絡してください。", "#dc2626");
    return;
  }

  enablePushBtn.disabled = true;
  enablePushBtn.textContent = "通知を設定しています...";

  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      throw new Error("通知が許可されませんでした。ブラウザまたは端末の設定で通知を許可してください。");
    }

    const registration = await navigator.serviceWorker.register("./service-worker.js");
    await navigator.serviceWorker.ready;

    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }

    const response = await fetch(window.GENBA_CONFIG.functionUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": window.GENBA_CONFIG.publishableKey
      },
      body: JSON.stringify({
        action: "subscribe_push",
        employee_name: employeeName,
        subscription: subscription.toJSON()
      })
    });

    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.error || "通知登録を保存できませんでした。");
    }

    showPushMessage("通知を設定しました。この端末で「完了」の通知を受け取れます。");
    enablePushBtn.textContent = "通知設定済み";
  } catch (error) {
    showPushMessage(error.message || "通知設定に失敗しました。", "#dc2626");
    enablePushBtn.disabled = false;
    enablePushBtn.textContent = "この端末で通知を受け取る";
  }
}

enablePushBtn.addEventListener("click", enablePushNotifications);


document.getElementById("requestDate").value =
  new Date().toLocaleDateString("en-CA");

function showMessage(message, color = "#15803d") {
  const el = document.getElementById("message");
  el.textContent = message;
  el.style.color = color;
}

function saveApplications() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(applications)
  );
}

function renderApplications() {
  const history = document.getElementById("applicationHistory");
  history.replaceChildren();

  if (applications.length === 0) {
    history.textContent = "申請はまだありません";
    return;
  }

  applications.forEach(item => {
    const div = document.createElement("div");
    div.className = "application";

    const title = document.createElement("strong");
    title.textContent = item.equipmentName + " × " + item.quantity;

    const details = document.createElement("div");
    details.textContent =
      "社員名: " + item.employeeName +
      "\n現場名: " + item.siteName +
      "\n希望日: " + item.requestDate +
      "\n申請理由: " + item.reason +
      "\n申請日時: " + item.savedAt;

    details.style.whiteSpace = "pre-line";

    const status = document.createElement("span");
    status.className = "status";
    status.textContent = item.status || "申請受付";

    div.append(title, details, status);
    history.appendChild(div);
  });
}

async function sendToDatabase(application) {
  if (!window.GENBA_CONFIG ||
      !window.GENBA_CONFIG.functionUrl ||
      !window.GENBA_CONFIG.publishableKey) {
    throw new Error("アプリ設定を確認してください");
  }

  const response = await fetch(
    window.GENBA_CONFIG.functionUrl,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": window.GENBA_CONFIG.publishableKey
      },
      body: JSON.stringify({
        table: "equipment_requests",
        employee_name: application.employeeName,
        record_data: application
      })
    }
  );

  const result = await response.json();

  if (!response.ok || !result.success) {
    throw new Error(
      result.error || "Databaseへの保存に失敗しました"
    );
  }

  return result;
}

async function refreshApplicationStatus(application) {
  try {
    const response = await fetch(window.GENBA_CONFIG.functionUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": window.GENBA_CONFIG.publishableKey
      },
      body: JSON.stringify({
        action: "lookup_equipment_status",
        id: application.recordId || null,
        employee_name: application.employeeName,
        siteName: application.siteName,
        equipmentName: application.equipmentName,
        requestDate: application.requestDate,
        savedAt: application.savedAt
      })
    });

    const result = await response.json();
    if (response.ok && result.success && result.status) {
      const previousStatus = application.status;
      application.status = result.status;
      if (previousStatus !== "完了" && result.status === "完了") {
        showMessage("備品申請が完了しました。現場：" + application.siteName + " / 備品：" + application.equipmentName, "#15803d");
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("備品申請が完了しました", { body: "現場：" + application.siteName + " / 備品：" + application.equipmentName });
        }
      }
      if (result.id) application.recordId = result.id;
      saveApplications();
      renderApplications();
    }
  } catch (error) {
    console.warn("Status refresh failed:", error);
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!form.reportValidity()) return;

  const quantity = Number(
    document.getElementById("quantity").value
  );

  if (!Number.isInteger(quantity) || quantity < 1) {
    alert("数量は1以上の整数で入力してください");
    return;
  }

  const application = {
    employeeName:
      document.getElementById("employeeName").value.trim(),

    siteName:
      document.getElementById("siteName").value.trim(),

    equipmentName:
      document.getElementById("equipmentName").value.trim(),

    quantity: quantity,

    requestDate:
      document.getElementById("requestDate").value,

    reason:
      document.getElementById("reason").value.trim(),

    savedAt:
      new Date().toLocaleString("ja-JP"),

    status: "未対応"
  };

  if (!application.employeeName ||
      !application.siteName ||
      !application.equipmentName ||
      !application.reason ||
      !application.requestDate) {
    alert("必須項目を入力してください");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "送信中...";
  showMessage("Databaseに送信しています...", "#64748b");

  try {
    const savedResult = await sendToDatabase(application);
    const savedRow = Array.isArray(savedResult.data) ? savedResult.data[0] : savedResult.data;
    if (savedRow && savedRow.id) application.recordId = savedRow.id;

    applications.unshift(application);
    saveApplications();
    renderApplications();

    showMessage("備品申請をDatabaseに保存しました！");
    alert("備品申請を保存しました！");

    form.reset();

    document.getElementById("requestDate").value =
      new Date().toLocaleDateString("en-CA");

  } catch (error) {
    showMessage("保存失敗：" + error.message, "#dc2626");
    alert("備品申請を保存できませんでした。\n" + error.message);

  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "申請を保存する";
  }
});

renderApplications();
applications.forEach(refreshApplicationStatus);
// Webpage-only users see status changes while this page remains open.
window.setInterval(() => {
  if (document.visibilityState === "visible") applications.forEach(refreshApplicationStatus);
}, 30000);
</script>

</body>
</html>
