
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>位置情報 | 現場つながる</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f1f5f9;
  color: #1e293b;
  font-family: Arial, sans-serif;
}

header {
  background: #17365d;
  color: white;
  text-align: center;
  padding: 22px;
  border-radius: 14px;
}

.container {
  max-width: 600px;
  margin: 20px auto;
}

.card {
  background: white;
  padding: 22px;
  margin-bottom: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: bold;
  margin: 16px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 9px;
  background: #15803d;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #94a3b8;
  cursor: wait;
}

#message {
  text-align: center;
  padding: 12px 0;
  font-weight: bold;
}

.location-item {
  border-bottom: 1px solid #e2e8f0;
  padding: 15px 0;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.location-item:last-child {
  border-bottom: none;
}

.map-link {
  display: inline-block;
  margin-top: 8px;
  color: #1d4ed8;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin: 22px 0;
  color: #17365d;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h2>現場つながる</h2>
  <p>位置情報管理</p>
</header>

<main class="container">

  <div class="card">
    <h3>📍 現在地を取得</h3>

    <label for="employeeName">社員名</label>
    <input
      type="text"
      id="employeeName"
      placeholder="社員名を入力してください"
      required
    >

    <button id="locationBtn" type="button">
      現在地を取得する
    </button>

    <p id="message" aria-live="polite">
      GPS位置情報を取得できます
    </p>

    <div id="currentLocation"></div>
  </div>

  <div class="card">
    <h3>📚 位置情報履歴</h3>
    <div id="locationHistory">記録はありません</div>
  </div>

  <a class="back" href="dashboard.html">
    ← ダッシュボードへ戻る
  </a>

</main>

<script>
const STORAGE_KEY = "genba_location_history";

let locations = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

const button = document.getElementById("locationBtn");
const message = document.getElementById("message");
const currentLocation = document.getElementById("currentLocation");

function saveLocations() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(locations)
  );
}

function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("このブラウザはGPSに対応していません"));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      resolve,
      reject,
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  });
}

button.addEventListener("click", async function() {
  const employeeName = document
    .getElementById("employeeName")
    .value.trim();

  if (!employeeName) {
    alert("社員名を入力してください");
    return;
  }

  button.disabled = true;
  button.textContent = "位置情報を取得中...";
  message.textContent = "GPS位置情報を取得しています...";

  try {
    const position = await getCurrentPosition();

    const record = {
      employeeName: employeeName,
      latitude: position.coords.latitude,
      longitude: position.coords.longitude,
      accuracy: position.coords.accuracy,
      recordedAt: new Date().toLocaleString("ja-JP")
    };

    locations.unshift(record);

    try {
      saveLocations();
    } catch (error) {
      locations.shift();
      throw new Error("保存容量が不足しています");
    }

    renderLocations();

    currentLocation.replaceChildren();

    const details = document.createElement("p");
    details.textContent =
      "緯度: " + record.latitude +
      "\n経度: " + record.longitude +
      "\n精度: 約" + Math.round(record.accuracy) + "m";

    details.style.whiteSpace = "pre-line";

    const mapLink = document.createElement("a");
    mapLink.href =
      "https://www.google.com/maps?q=" +
      record.latitude + "," + record.longitude;

    mapLink.textContent = "Google Mapsで現在地を確認";
    mapLink.target = "_blank";
    mapLink.rel = "noopener noreferrer";
    mapLink.className = "map-link";

    currentLocation.append(details, mapLink);

    message.textContent = "位置情報を保存しました！";

  } catch (error) {
    let errorMessage = "位置情報を取得できませんでした。";

    if (error.code === 1) {
      errorMessage =
        "位置情報の利用が許可されていません。ブラウザの設定を確認してください。";
    } else if (error.code === 2) {
      errorMessage =
        "現在地を確認できません。GPS設定を確認してください。";
    } else if (error.code === 3) {
      errorMessage =
        "位置情報の取得がタイムアウトしました。もう一度お試しください。";
    } else if (error.message) {
      errorMessage = error.message;
    }

    message.textContent = errorMessage;

  } finally {
    button.disabled = false;
    button.textContent = "現在地を取得する";
  }
});

function renderLocations() {
  const history = document.getElementById("locationHistory");
  history.replaceChildren();

  if (locations.length === 0) {
    history.textContent = "記録はありません";
    return;
  }

  locations.forEach(item => {
    const div = document.createElement("div");
    div.className = "location-item";

    const name = document.createElement("strong");
    name.textContent = "社員名: " + item.employeeName;

    const details = document.createElement("p");
    details.textContent =
      "緯度: " + item.latitude +
      "\n経度: " + item.longitude +
      "\n精度: 約" + Math.round(item.accuracy) + "m" +
      "\n取得日時: " + item.recordedAt;

    details.style.whiteSpace = "pre-line";

    const link = document.createElement("a");
    link.href =
      "https://www.google.com/maps?q=" +
      item.latitude + "," + item.longitude;

    link.textContent = "Google Mapsで位置を確認";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.className = "map-link";

    div.append(name, details, link);
    history.appendChild(div);
  });
}

renderLocations();
</script>

</body>
</html>
